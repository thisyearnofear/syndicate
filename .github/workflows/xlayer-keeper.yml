# X Layer keeper pinger — Hobby-tier workaround.
#
# Vercel Hobby allows only daily crons, so the keeper's vercel.json entry
# runs once a day. This workflow pings the same CRON_SECRET-gated endpoint
# hourly to keep epochs moving faster during the Build X AI Season window.
# It is inert until KEEPER_PING_URL and CRON_SECRET are set as repo secrets.
# Note: GitHub scheduled jobs can lag ~10–30 minutes — fine for a testnet
# demo, never a production randomness path.

name: xlayer-keeper-ping

on:
  schedule:
    - cron: '17 * * * *' # offset from the hour to avoid the top-of-hour rush
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keeper endpoint
        env:
          KEEPER_PING_URL: ${{ secrets.KEEPER_PING_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$KEEPER_PING_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "KEEPER_PING_URL or CRON_SECRET not set — pinger is inert, skipping."
            exit 0
          fi
          curl -sfS -H "Authorization: Bearer $CRON_SECRET" "$KEEPER_PING_URL"
