name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: forge-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm

      # Fhenix contracts import from @fhenixprotocol/contracts, which lives in
      # node_modules/ (gitignored). Without this step, `forge build` cannot
      # resolve those imports and the Foundry job fails. This was the real
      # cause of the 14-day red streak on main, not the toolchain version.

      - name: Install npm dependencies (for Fhenix Solidity imports)
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        # Pinned to v1.2.3 so the toolchain version itself is no longer a
        # moving target. See the matching comment in ci.yml for full context.
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: Show Forge version
        run: |
          forge --version

      - name: Run Forge fmt
        run: |
          forge fmt --check
        id: fmt

      - name: Run Forge build
        run: |
          forge build --sizes
        id: build

      - name: Run Forge tests
        run: |
          forge test -vvv
        id: test
