name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  test:
    name: Unit Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests with coverage (enforces per-file thresholds)
        run: pnpm test:coverage

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  forge:
    name: Foundry (fmt + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      # Fhenix contracts import from @fhenixprotocol/contracts, which lives in
      # node_modules/ (gitignored). Without this step, `forge build` cannot
      # resolve those imports and the Foundry job fails. This was the real
      # cause of the 14-day red streak on main, not the toolchain version.

      - name: Install npm dependencies (for Fhenix Solidity imports)
        run: pnpm install --frozen-lockfile

      - name: Install Foundry
        # Pinned to v1.2.3 so the toolchain version itself is no longer a
        # moving target. (Originally hypothesised as the cause of the red
        # streak; turned out to be a missing pnpm install, fixed above.
        # Pin kept as defence-in-depth.)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3

      - name: forge fmt
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vvv
